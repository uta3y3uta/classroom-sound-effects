<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="description" content="ボタンを押すだけで効果音が鳴る，授業を盛り上げる教室用サウンドボード。">
<title>教室効果音アプリ</title>
<!-- 効果音：OtoLogic https://otologic.jp （CC BY 4.0・一部を短縮／加工） ／ 魔王魂 https://maou.audio
     ／ Freesound https://freesound.org （CC0）
     アイコン：Lucide https://lucide.dev （ISC） -->
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="play">

<div class="top">
  <div class="brand">
    <span class="mark">教室効果音</span>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="tablist">
    <button role="tab" data-mode="play" aria-selected="true" data-icon="play"><span class="gi"></span>使う</button>
    <button role="tab" data-mode="edit" aria-selected="false" data-icon="sliders-horizontal"><span class="gi"></span>つくる</button>
  </div>
  <button class="icon-btn" id="share" title="共有URLを発行" data-icon="share-2"></button>
</div>

<div class="editbar">
  <span class="lbl">ならべかた</span>
  <div class="stepper">
    <button id="colMinus" data-icon="minus" aria-label="横を減らす"></button>
    <span class="val" id="colVal">4</span>
    <button id="colPlus" data-icon="plus" aria-label="横を増やす"></button>
  </div>
  <span class="lbl">×</span>
  <div class="stepper">
    <button id="rowMinus" data-icon="minus" aria-label="縦を減らす"></button>
    <span class="val" id="rowVal">4</span>
    <button id="rowPlus" data-icon="plus" aria-label="縦を増やす"></button>
  </div>
  <span class="hint" id="padCount"></span>
  <div class="spacer"></div>
  <button class="icon-btn" id="resetAll" title="ぜんぶ空にする" data-icon="trash-2"></button>
</div>

<div class="stage"><div id="grid"></div></div>

<div class="bottom">
  <button class="icon-btn" id="mute" title="ミュート" data-icon="volume-2"></button>
  <div class="vol-wrap">
    <input type="range" id="vol" min="0" max="100" value="80" aria-label="音量">
    <span id="volNum">80%</span>
  </div>
  <button class="icon-btn danger" id="stop" title="音を止める" data-icon="square"></button>
</div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <span class="sheet-title" id="sheetTitle">音をえらぶ</span>
      <div class="spacer"></div>
      <button class="icon-btn" id="sheetClear" title="このパッドを空にする" data-icon="eraser"></button>
      <button class="icon-btn" id="sheetClose" title="閉じる" data-icon="check"></button>
    </div>
    <label class="search">
      <span class="gi" data-icon="search"></span>
      <input type="search" id="q" placeholder="音の名前でさがす" autocomplete="off">
    </label>
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="icons.js"></script>
<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
