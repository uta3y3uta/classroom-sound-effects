<!doctype html>
<!-- レゲエホーンの聴き比べ用の仮ページ。音が決まったら削除する -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レゲエホーン 聴き比べ</title>
<style>
  body{margin:0;padding:24px;background:#0e0e14;color:#eee;font-family:system-ui,sans-serif}
  h1{font-size:18px;margin:0 0 4px}
  p{font-size:13px;color:#9a9aa8;margin:0 0 20px;line-height:1.7}
  button{display:block;width:100%;max-width:420px;margin:0 0 12px;padding:18px;
    font-size:17px;font-weight:700;color:#fff;background:#1b1b26;border:1px solid #33334a;
    border-radius:14px;cursor:pointer}
  button:active{background:#2a2a3c}
  small{display:block;font-weight:400;font-size:12px;color:#9a9aa8;margin-top:4px}
</style>
<h1>レゲエホーン 聴き比べ</h1>
<p>ボタンを連打して鳴り方も確かめてください。<br>いちばん近いものの記号（A／B／C）を教えてください。</p>
<div id="b"></div>
<script>
const LIST = [
  ["a", "A", "低めで太い（シ♭＋レ♭の短三度）"],
  ["b", "B", "中くらい・三和音で派手（ド♯＋ミ＋ラ♭）"],
  ["c", "C", "高くて刺さる（レ♯＋ファ の長二度）"],
  ["now", "いま入っている音", "参考・法螺貝を加工したもの"],
];
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const buf = {}, cur = {};
for (const [id, label, note] of LIST) {
  const url = id === "now" ? "sfx/horn.mp3" : "sfx/horn-" + id + ".mp3";
  fetch(url).then(r => r.arrayBuffer()).then(a => ctx.decodeAudioData(a)).then(d => buf[id] = d);
  const el = document.createElement("button");
  el.innerHTML = label + "<small>" + note + "</small>";
  el.onpointerdown = () => {
    ctx.resume();
    if (!buf[id]) return;
    if (cur[id]) { cur[id].g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.02); cur[id].s.stop(ctx.currentTime + 0.025); }
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = buf[id]; s.connect(g).connect(ctx.destination); s.start();
    cur[id] = { s, g };
  };
  document.getElementById("b").appendChild(el);
}
</script>
