<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<title>配色くらべ</title>
<style>
:root{
  --bg:#0a0a0c;--surface:#131317;--surface-2:#1a1a20;
  --line:#2a2a33;--line-soft:#212129;
  --text:#e9e9ef;--text-dim:#8b8b99;--text-faint:#5a5a68;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-feature-settings:"palt";
  padding:24px 16px 48px;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
svg{display:block;}

header{max-width:1180px;margin:0 auto 22px;}
h1{font-size:20px;letter-spacing:.12em;margin-bottom:8px;}
.lead{font-size:13px;line-height:1.8;color:var(--text-dim);}
.lead b{color:var(--text);}
.toggle{
  margin-top:14px;display:inline-flex;align-items:center;gap:10px;
  padding:8px 14px;border:1px solid var(--line);border-radius:999px;
  font-size:13px;color:var(--text-dim);
}
.toggle .knob{
  width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;
}
.toggle .knob::after{
  content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
  background:var(--text-dim);transition:transform .15s,background .15s;
}
.toggle[aria-pressed="true"]{color:var(--text);border-color:var(--text-faint);}
.toggle[aria-pressed="true"] .knob{background:#3a3a48;}
.toggle[aria-pressed="true"] .knob::after{transform:translateX(14px);background:var(--text);}

main{
  max-width:1180px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;
}
@media (max-width:420px){main{grid-template-columns:1fr;}}

.card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;
  padding:16px 16px 18px;
}
.card.best{border-color:#3a3a48;}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.letter{
  width:32px;height:32px;border-radius:9px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:var(--text);color:var(--bg);font-weight:800;font-size:17px;
}
.letter.now{background:var(--line);color:var(--text-dim);font-size:11px;}
.name{font-size:16px;font-weight:700;letter-spacing:.04em;}
.tag{
  margin-left:auto;font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--text-dim);white-space:nowrap;
}
.tag.best{border-color:transparent;background:var(--text);color:var(--bg);font-weight:700;}
.desc{font-size:12.5px;line-height:1.75;color:var(--text-dim);margin-bottom:12px;min-height:3.5em;}
.chips{display:flex;flex-wrap:wrap;gap:6px 12px;margin:-4px 0 12px;font-size:11.5px;color:var(--text-dim);}
.chips span{display:inline-flex;align-items:center;gap:5px;}
.chips i{width:10px;height:10px;border-radius:3px;background:var(--c);}

/* ここから下は本番アプリのボタンと同じ見た目 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pad{
  position:relative;aspect-ratio:1/1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:6px 4px;border-radius:14px;
  border:1px solid var(--line-soft);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  color:var(--text-dim);overflow:hidden;
  transition:transform .08s ease,border-color .15s;
}
.pad::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(90% 70% at 50% 0%,var(--c),transparent 72%);
  opacity:0;transition:opacity .18s ease;pointer-events:none;
}
.pad .glyph{position:relative;width:30px;height:30px;color:var(--c);transition:transform .08s ease;}
.pad .glyph svg{width:100%;height:100%;}
.pad .cap{
  position:relative;font-size:11px;font-weight:600;line-height:1.15;color:var(--text-dim);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pad.hit{transform:scale(.965);border-color:var(--c);}
.pad.hit::after{opacity:.22;}
.pad.hit .cap{color:var(--text);}
.pad.hit .glyph{transform:scale(1.08);}
body.glow .pad .glyph svg{filter:drop-shadow(0 0 5px var(--c)) drop-shadow(0 0 1px var(--c));}
body.glow .pad::after{opacity:.07;}
body.glow .pad.hit::after{opacity:.26;}

footer{max-width:1180px;margin:26px auto 0;font-size:12px;line-height:1.8;color:var(--text-faint);}
</style>
</head>
<body>

<header>
  <h1>配色くらべ</h1>
  <p class="lead">
    いまの既定の並びで，色だけを変えた見本です。ボタンを押すと，本番と同じように光ります。<br>
    <b>気に入った記号を教えてください。</b>「Aを光らせて」「Cの色を黄色で」のような組み合わせでもだいじょうぶです。
  </p>
  <button class="toggle" id="glow" aria-pressed="false"><span class="knob"></span>おまけ：アイコンをほんのり光らせてみる</button>
</header>

<main id="cards"></main>

<footer>
  ※ 色は画面によって少しずつ見え方が変わります。教室のテレビやプロジェクターでも一度見てみてください。
</footer>

<script src="icons.js?v=20"></script>
<script src="catalog.js?v=20"></script>
<script>
(() => {
  const ICONS = window.ICONS, SOUNDS = window.SOUNDS;
  const byId = new Map(SOUNDS.map((s) => [s.i, s]));
  const SLOTS = ["jajaan","mokugyo","buu","seikai2",
                 "tenshi","drumroll","memai","yay",
                 "tettere","iyoo","uwaa","hakushu",
                 "pafupafu","kotsuzumi","gakkari","horn"];
  const svg = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ""}</svg>`;

  const F = { doki: "#ff54a5", ok: "#fec848", ng: "#5097ff", pika: "#61ebfa", wa: "#fd6a3a", wara: "#81e86a" };

  const PLANS = [
    { key: "now", name: "ネオンの虹", tag: "いまの既定",
      desc: "32色を1つおきに使った虹。16個ぜんぶがちがう色で，いちばんにぎやか。そのぶん，となりどうしの色がぶつかりやすい。",
      colors: ["#ff3838","#ff7f38","#ffb438","#ffe638","#d0ff38","#38ff39","#38ffb7","#38f7ff",
               "#38cbff","#389eff","#386eff","#4838ff","#8f38ff","#cf38ff","#ff38ea","#ff3898"] },
    { key: "A", name: "ネオンサイン", tag: "おすすめ", best: true,
      desc: "ピンク → むらさき → 水色。左上から右下へ，夜の街の看板のように色が流れる。黒い画面にいちばん映える。",
      colors: ["#ff569e","#e741da","#b055fe","#8d85ff","#e741da","#b055fe","#8d85ff","#72a3fe",
               "#b055fe","#8d85ff","#72a3fe","#58c4ff","#8d85ff","#72a3fe","#58c4ff","#0fe3fe"] },
    { key: "B", name: "サンセット", tag: "あたたかい",
      desc: "黄 → オレンジ → ピンク。夕焼けのような流れ。明るく元気で，教室の雰囲気に合わせやすい。",
      colors: ["#ffdc4f","#febd5a","#ff9b52","#fe825c","#febd5a","#ff9b52","#fe825c","#fe626c",
               "#ff9b52","#fe825c","#fe626c","#fe478c","#fe825c","#fe626c","#fe478c","#f52ab6"] },
    { key: "C", name: "ワントーン", tag: "いちばんすっきり",
      desc: "ぜんぶ水色1色。プロの機材のような落ち着いた見た目。色は32色のどれにでも差しかえられる。",
      colors: Array(16).fill("#0ee8fa") },
    { key: "D", name: "段ごとに色分け", tag: "場所を覚えやすい",
      desc: "上から赤・黄・緑・青。「黄色の段の2つめ」のように，場所で覚えて押せる。",
      colors: [..."0000111122223333"].map((r) => ["#fe707a","#ffbd4a","#45eca4","#52a9fe"][r]) },
    { key: "E", name: "パステルの虹", tag: "やさしい",
      desc: "いまと同じ虹の順で，やわらかい色に。まぶしさがなく，かわいい雰囲気。",
      colors: ["#ffc3be","#fec6aa","#f9cb97","#e8d393","#d2db9b","#bae2ab","#a3e6c1","#92e7d9",
               "#8ee5ef","#9ae0fe","#b5d8fe","#c6d2ff","#d7ccff","#ecc3f9","#fbbfe6","#fec1d0"] },
    { key: "F", name: "音の種類で色分け", tag: "色で音をさがせる",
      desc: "同じ種類の音を同じ色に。見た目のまとまりは下がるが，「青いのは残念の音」とすぐ分かる。",
      chips: [["正解・もりあがり", F.ok], ["残念", F.ng], ["ドキドキ", F.doki],
              ["ひらめき", F.pika], ["和", F.wa], ["笑い", F.wara]],
      colors: [F.doki, F.wa, F.ng, F.ok,  F.pika, F.doki, F.ng, F.ok,
               F.pika, F.wa, F.wara, F.ok,  F.wara, F.wa, F.ng, F.ok] },
  ];

  const cards = document.getElementById("cards");
  cards.innerHTML = PLANS.map((p) => `
    <section class="card${p.best ? " best" : ""}">
      <div class="head">
        <span class="letter${p.key === "now" ? " now" : ""}">${p.key === "now" ? "現行" : p.key}</span>
        <span class="name">${p.name}</span>
        <span class="tag${p.best ? " best" : ""}">${p.tag}</span>
      </div>
      <p class="desc">${p.desc}</p>
      ${p.chips ? `<div class="chips">${p.chips.map(([t, c]) => `<span><i style="--c:${c}"></i>${t}</span>`).join("")}</div>` : ""}
      <div class="grid">${SLOTS.map((id, i) => {
        const s = byId.get(id);
        return `<button class="pad" style="--c:${p.colors[i]}"><span class="glyph">${svg(s.ic)}</span><span class="cap">${s.n}</span></button>`;
      }).join("")}</div>
    </section>`).join("");

  // 本番と同じように，押すと光る
  cards.addEventListener("pointerdown", (e) => {
    const pad = e.target.closest(".pad");
    if (pad) pad.classList.add("hit");
  });
  const off = (e) => { const pad = e.target.closest && e.target.closest(".pad"); if (pad) pad.classList.remove("hit"); };
  cards.addEventListener("pointerup", off);
  cards.addEventListener("pointerleave", off, true);
  cards.addEventListener("pointercancel", off);

  const glow = document.getElementById("glow");
  glow.addEventListener("click", () => {
    const on = document.body.classList.toggle("glow");
    glow.setAttribute("aria-pressed", on ? "true" : "false");
  });
})();
</script>
</body>
</html>
