<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<title>デーデン聴き比べ</title>
<style>
:root{--bg:#0a0a0c;--surface:#131317;--line:#2a2a33;--text:#e9e9ef;--dim:#8b8b99;--faint:#5a5a68;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);padding:24px 16px 48px;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;}
h1{font-size:19px;letter-spacing:.1em;margin-bottom:8px;}
p.lead{font-size:13px;line-height:1.8;color:var(--dim);margin-bottom:18px;max-width:640px;}
p.lead b{color:var(--text);}
.list{display:grid;gap:10px;max-width:640px;}
button{font:inherit;color:inherit;cursor:pointer;width:100%;text-align:left;
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;}
button:active{transform:scale(.99);}
button.on{border-color:#7df9ff;box-shadow:0 0 0 1px #7df9ff inset;}
.k{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--text);color:var(--bg);font-weight:800;font-size:18px;}
.k.old{background:var(--line);color:var(--dim);font-size:11px;}
.t{font-size:15px;font-weight:700;}
.d{font-size:12px;color:var(--dim);margin-top:3px;}
.tag{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:700;white-space:nowrap;}
.tag.old{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:400;}
.sep{margin:18px 0 4px;font-size:12px;color:var(--faint);}
</style>
</head>
<body>
<h1>デーデン聴き比べ</h1>
<p class="lead">
  問題を出すときの音の候補です。押すと，アプリと同じ大きさで鳴ります。<br>
  <b>いちばん「デーデン」に近い記号を教えてください。</b>いまはＡを仮に入れてあります。
</p>
<div class="list" id="list"></div>

<script>
(() => {
  // [記号, ファイル, 名前, 説明, 音量補正（アプリと同じ）, タグ]
  const C = [
    ["A", "deeden-a", "出題01", "響きなし。いちばん基本の形", 1.972, "いま仮に入れた音"],
    ["B", "deeden-b", "出題01（響きあり）", "Ａにホールのような響き", 1.95],
    ["C", "deeden-c", "出題01（やまびこ）", "Ａにやまびこのような繰り返し", 2.042],
    ["D", "deeden-d", "出題03（低）", "低めの音", 2.065],
    ["E", "deeden-e", "出題03（高）", "Ｄを高くした音", 2.113],
    ["F", "deeden-f", "出題03（低・別の形）", "Ｄとは別の形の低め", 1.567],
    ["G", "deeden-g", "出題03（高・別の形）", "Ｆを高くした音", 1.641],
    ["H", "deeden-h", "出題04（低）", "長めに鳴る低めの音", 1.549],
    ["I", "deeden-i", "出題04（中）", "Ｈを少し高くした音", 1.531],
    ["J", "deeden-j", "出題04（高）", "Ｈをさらに高くした音", 1.462],
  ];
  const OLD = ["前", "jajaan-old", "ジャカジャン（前の音）", "出題02（低）。比べるための参考", 1.567, "前の音"];

  const list = document.getElementById("list");
  const row = ([k, f, name, desc, g, tag], old) =>
    `<button data-f="${f}" data-g="${g}"><span class="k${old ? " old" : ""}">${k}</span>` +
    `<span><div class="t">${name}</div><div class="d">${desc}</div></span>` +
    (tag ? `<span class="tag${old ? " old" : ""}">${tag}</span>` : "") + `</button>`;
  list.innerHTML = C.map((c) => row(c)).join("") + `<div class="sep">比べるための参考</div>` + row(OLD, true);

  // アプリと同じく Web Audio で，音量補正とリミッターをかけて鳴らす
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
  limiter.attack.value = 0.003; limiter.release.value = 0.1;
  const master = ctx.createGain();
  master.gain.value = Math.pow(0.8, 1.6) * 0.95;      // アプリの音量80と同じ
  master.connect(limiter).connect(ctx.destination);
  const bufs = new Map();
  let playing = null;
  const load = (f) => bufs.get(f) || bufs.set(f, fetch(`try/${f}.mp3`).then((r) => r.arrayBuffer())
    .then((a) => ctx.decodeAudioData(a))).get(f);

  list.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (ctx.state !== "running") ctx.resume();
    for (const x of list.querySelectorAll("button")) x.classList.toggle("on", x === b);
    const buf = await load(b.dataset.f);
    if (playing) try { playing.stop(); } catch (err) {}
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = buf; g.gain.value = +b.dataset.g;
    src.connect(g).connect(master); src.start();
    playing = src;
  });
})();
</script>
</body>
</html>
